<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spendwise-bg" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A1A2E"/>
      <stop offset="100%" stop-color="#2A0F1A"/>
    </linearGradient>
    <linearGradient id="spendwise-gold" x1="16" y1="16" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8CC94"/>
      <stop offset="50%" stop-color="#D4AF6A"/>
      <stop offset="100%" stop-color="#A67C36"/>
    </linearGradient>
    <filter id="gold-glow" x="10" y="10" width="36" height="36" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="1" y="1" width="54" height="54" rx="16" fill="url(#spendwise-bg)" stroke="#D4AF6A" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Gold Spendwise S & Wallet Accent -->
  <g filter="url(#gold-glow)">
    <rect x="15" y="19" width="26" height="19" rx="4" fill="none" stroke="url(#spendwise-gold)" stroke-width="2.5"/>
    <path d="M15 24H41" stroke="url(#spendwise-gold)" stroke-width="2" stroke-linecap="round"/>
    <!-- Wallet Flap & Clasp -->
    <path d="M32 26H39C40.1046 26 41 26.8954 41 28V31C41 32.1046 40.1046 33 39 33H32V26Z" fill="#3E1426" stroke="url(#spendwise-gold)" stroke-width="2"/>
    <circle cx="36" cy="29.5" r="1.5" fill="url(#spendwise-gold)"/>
    <!-- Subtle Rising Sparkle -->
    <path d="M22 15L23.2 17.5L25.7 18.7L23.2 19.9L22 22.4L20.8 19.9L18.3 18.7L20.8 17.5L22 15Z" fill="url(#spendwise-gold)"/>
  </g>
</svg>
